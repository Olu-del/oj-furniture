Authentication & Security System (auth.controller.js)
required the project to demonstrate strong authentication,
user protection, and secure account recovery mechanisms.
This includes:
•	secure user registration
•	login with brute force protection
•	password reset workflow
•	email notifications
•	session management
•	admin/user role separation
The authentication system I implemented satisfies all of these
requirements and goes beyond the basics by adding account lockout,
reset codes, and welcome emails, creating a professional and secure user experience.

1. Secure User Registration
The register controller implements:
Strong validation
•	Required fields (name, email, password, address)
•	Email format validation
•	Minimum password length

Duplicate account prevention
The system checks if the email already exists before creating a new user.

Password hashing
Passwords are hashed using bcryptjs before being stored in the database.

Automatic address creation
A default shipping address is created during registration, improving UX and accessibility.

Welcome email
A personalised welcome email is sent using Nodemailer and HTML templates.

Automatic sign-in
After registration, the user is automatically authenticated and receives a secure HTTP-only cookie.
This creates a smooth onboarding experience while maintaining strong security.

2. Sign in with Account Lockout Protection
 emphasised trust and accountability, which includes protecting users from brute force attacks.
The sign-in controller implements:
Failed sign-in attempt tracking
Each failed attempt increments failedLoginAttempts.
Automatic account lockout
After 3 failed attempts, the account is locked:
accountLocked = true

Clear messaging
Users are told exactly why they are locked out and how to recover.

Reset on successful sign-in
If the user signs in successfully, failed attempts are reset to 0.
Secure session cookie
A JWT token is stored in an HTTP-only cookie, protecting against XSS attacks.
This system mirrors real-world security practices used by banks and e-commerce platforms.

3. Password Reset Workflow
 required a clear mechanism for handling forgotten passwords.
The system implements a two-step reset process:

Step 1 — Request Reset Code
requestPasswordReset:
Generates a 6-digit numeric reset code
Easy for users to type, hard to guess.
Sets a 15-minute expiry
Prevents reuse or brute forcing.
Sends reset code via email
Using HTML templates for clarity and professionalism.

Step 2 — Reset Password
resetPassword:
Validates email + code
Ensures the request is legitimate.
Checks expiry
Expired codes are rejected.
Hashes the new password
Using bcrypt.
Unlocks the account

Resets:
•	failedLoginAttempts
•	accountLocked
•	resetCode
•	resetCodeExpiry
Confirms success
User receives a clear success message.
This workflow is secure, user-friendly, and meets industry standards.

 4. Sign Out
signout simply clears the authentication cookie:
res.clearCookie("token")
This ensures:
•	no lingering sessions
•	secure logout
•	predictable behaviour

5. Role-Based Access Control
The authentication system integrates with:
•	auth.middleware.js → verifies JWT
•	admin.middleware.js → checks role === "ADMIN"

This ensures:
•	only admins can access admin routes
•	users cannot escalate privileges
•	sensitive operations (orders, complaints, sustainability analytics) are protected
This directly supports requirement for accountability.

