Email Communication System (email.js & email.template.js)
Strong UX principles, trust-building mechanisms, and 
clear communication between the platform and its users.

To support these goals, I implemented a complete email
notification system using Nodemailer and custom HTML templates.

This system enhances the platform in four key areas:
•	Authentication & Security
•	User Experience & Trust
•	Transparency & Accountability
•	Professional Communication

1. Email Transport Layer (email.js)
The email.js module configures a secure email transport using Nodemailer and Gmail’s SMTP service.
 Secure authentication

Credentials are stored in environment variables:
•	EMAIL_USER
•	EMAIL_PASS
 Reusable email sender
The sendEmail() function accepts:
•	to
•	subject
•	html

This makes it easy to send structured emails from anywhere in the backend.
 Professional sender identity

Emails are sent from:
"OJ Furniture" <ojfurniture2026@gmail.com>
This builds trust and brand consistency.

